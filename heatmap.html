  <script>
    var map = L.map("map").setView([49.2827, -123.1207], 13);

    var osmLayer = L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap",
      },
    ).addTo(map);

    // 1. Define Markers
    var bcPlace = L.marker([49.276759, -123.112106]).bindPopup(
      "<b>BC Place Stadium</b>",
    );
    var pneAmphitheatre = L.marker([49.2828, -123.0366]).bindPopup(
      "<b>PNE Amphitheatre (Fan Festival)</b>",
    );

    // 2. Define Heatmap Data [lat, lng, intensity]
    var crowdData = [
      [49.2828, -123.0366, 1.0], // Super crowded at the stage
      [49.283, -123.037, 0.7],
      [49.2825, -123.036, 0.8],
      [49.2767, -123.1121, 0.9], // Crowds at BC Place too
    ];

    // 3. Create the Heat Layer
    var heatLayer = L.heatLayer(crowdData, { radius: 25, blur: 15 });

    // 4. Setup Controls
    var baseMaps = { OpenStreetMap: osmLayer };
    var overlayMaps = {
      "BC Place": bcPlace,
      "PNE Fan Festival": pneAmphitheatre,
      "Crowd Density": heatLayer, // This adds the checkbox!
      "Bus Route 16": L.geoJSON(route16, {
        style: {
          color: "#d81b60",
          weight: 4,
        },
      }), // Add bus route as an overlay
    };

    // Add everything to map by default
    bcPlace.addTo(map);
    pneAmphitheatre.addTo(map);
    heatLayer.addTo(map);

    L.control.layers(baseMaps, overlayMaps).addTo(map);

<!doctype html>
<html lang="en">
  <head>
    <title>Crowd Control</title>
    <meta name="comp1800 BBY-09" content="Crowd Control" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="module" crossorigin src="/assets/socialfeed-CysHEf4E.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/style-BFfoeqTT.js">
    <link rel="modulepreload" crossorigin href="/assets/app-NQZPMTrD.js">
    <link rel="stylesheet" crossorigin href="/assets/style.css">
  </head>

  <body>
    <!-- NAV BAR -->
    <site-navbar></site-navbar>

    <div class="container py-4" style="max-width: 680px">
      <!-- <h1 class="mb-1">Social Feed</h1>
      <p class="text-muted mb-4">Latest crowd posts from around Vancouver.</p> -->

      <!-- Posts Created by Social Feed-->
      <div id="socialFeed"></div>
    </div>

    <!-- FILTER DROPDOWN -->
    <div id="filterWrapper">
      <div class="dropdown">
        <button
          class="btn btn-outline-dark btn-sm dropdown-toggle"
          type="button"
          id="filterDropdown"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          Filter
        </button>
        <ul
          class="dropdown-menu dropdown-menu-end p-3"
          aria-labelledby="filterDropdown"
          style="min-width: 250px"
        >
          <!-- Crowd Level -->
          <div>
            <strong>Crowd Level</strong>
            <div class="d-flex flex-wrap gap-1 mt-1">
              <button
                class="btn btn-outline-dark btn-sm filter-btn"
                data-filter="crowd-level"
              >
                1 - Not Crowded
              </button>
              <button
                class="btn btn-outline-dark btn-sm filter-btn"
                data-filter="crowd-level"
              >
                2
              </button>
              <button
                class="btn btn-outline-dark btn-sm filter-btn"
                data-filter="crowd-level"
              >
                3
              </button>
              <button
                class="btn btn-outline-dark btn-sm filter-btn"
                data-filter="crowd-level"
              >
                4
              </button>
              <button
                class="btn btn-outline-dark btn-sm filter-btn"
                data-filter="crowd-level"
              >
                5 - Very Crowded
              </button>
            </div>
          </div>

          <!-- LOCATION-->
          <div class="mt-2">
            <strong>Location</strong>
            <div class="d-flex flex-wrap gap-1 mt-1">
              <button
                class="btn btn-outline-dark btn-sm filter-btn"
                data-filter="Location"
              >
                BC PLACE
              </button>
              <button
                class="btn btn-outline-dark btn-sm filter-btn"
                data-filter="Location"
              >
                Pacific National Exhibition
              </button>
              <button
                class="btn btn-outline-dark btn-sm filter-btn"
                data-filter="Location"
              >
                Commercial-Broadway Station
              </button>

              <button
                class="btn btn-outline-dark btn-sm filter-btn"
                data-filter="Location"
              >
                Renfrew Skytrain Station
              </button>
              <button
                class="btn btn-outline-dark btn-sm filter-btn"
                data-filter="Location"
              >
                Stadium-Chinatown Station
              </button>
            </div>
          </div>

          <!-- Clear Filters -->
          <div class="mt-3">
            <button
              id="clearFilterBtn"
              class="btn btn-outline-secondary btn-sm w-100"
            >
              Clear Filters
            </button>
          </div>
        </ul>
      </div>
    </div>
  </body>
</html>

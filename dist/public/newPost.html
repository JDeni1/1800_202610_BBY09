<!doctype html>
<html lang="en">
  <head>
    <title>Crowd Control – Make a Post</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/newPost-Dz4BiD7y.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/style-C8lpMh0T.js">
    <link rel="modulepreload" crossorigin href="/assets/app-b2uk4N-a.js">
    <link rel="stylesheet" crossorigin href="/assets/style-PR4gWVAG.css">
    <link rel="stylesheet" crossorigin href="/assets/newPost-BfapA4tk.css">
  </head>

  <body>
    <!-- NAV BAR -->
    <site-navbar></site-navbar>

    <div class="card">
      <h1>Make a Post</h1>

      <div class="field">
        <label for="card-title">Caption</label>
        <input type="text" id="post-title" placeholder="Title" />
      </div>

      <div class="field">
        <label for="detailsInput">Description</label>
        <textarea
          id="detailsInput"
          placeholder="Describe what's happening…"
        ></textarea>
      </div>

      <div class="field">
        <label for="inputImage">Photo</label>
        <input
          type="file"
          id="inputImage"
          accept="image/*"
          style="font-size: 0.85rem; color: #555"
        />
        <img
          id="picture"
          width="100"
          height="100"
          style="
            display: none;
            margin-top: 8px;
            border-radius: 6px;
            object-fit: cover;
          "
        />
      </div>

      <div class="field">
        <label for="spotSelect">Location</label>
        <select id="spotSelect">
          <option value="" disabled selected>Select an event spot…</option>
        </select>
      </div>

      <div class="field">
        <label>Crowd Status</label>
        <div class="crowd-row">
          <input type="radio" name="crowdStatus" id="status1" value="1" />
          <label class="crowd-btn" for="status1"
            ><span class="num">1</span><span class="lbl">Empty</span></label
          >

          <input type="radio" name="crowdStatus" id="status2" value="2" />
          <label class="crowd-btn" for="status2"
            ><span class="num">2</span><span class="lbl">Quiet</span></label
          >

          <input type="radio" name="crowdStatus" id="status3" value="3" />
          <label class="crowd-btn" for="status3"
            ><span class="num">3</span><span class="lbl">Moderate</span></label
          >

          <input type="radio" name="crowdStatus" id="status4" value="4" />
          <label class="crowd-btn" for="status4"
            ><span class="num">4</span><span class="lbl">Busy</span></label
          >

          <input type="radio" name="crowdStatus" id="status5" value="5" />
          <label class="crowd-btn" for="status5"
            ><span class="num">5</span><span class="lbl">Packed</span></label
          >
        </div>
      </div>

      <button id="submitBtn" type="button">Post Now</button>
      <div id="form-feedback"></div>
    </div>
  </body>
</html>

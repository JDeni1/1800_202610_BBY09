        <!-- Create Post Form -->
      <div class="card mb-4">
        <div class="card-body">
          <form id="postForm">
            <div class="mb-2">
              <input type="text" id="username" class="form-control" placeholder="Username" required>
            </div>

            <div class="mb-2">
              <textarea id="content" class="form-control" placeholder="What's on your mind?" required></textarea>
            </div>

            <div class="mb-2">
              <input type="file" id="imageFile" class="form-control" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary w-100">Post</button>
          </form>
        </div>
      </div>

  <div id="feed"></div>

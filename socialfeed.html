<!doctype html>
<html lang="en">
  <head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
  </head>

  <body>
    <!-- our own navbar goes here -->
    <site-navbar></site-navbar>

    <!-- Main content goes here -->
    <main class="container py-4">
      <h1 id="SocialName">Social Feed</h1>
      <div
        id="allPosts-goes-here"
        class="row row-cols-1 row-cols-md-3 g-4"
      ></div>
    </main>

    <template id="postCardTemplate">
      <div class="col">
        <div class="card h-100">
          <img class="card-img-top card-image" src="..." alt="post-image" />
          <div class="card-body">
            <h5 class="card-title"></h5>
            <p class="card-text"></p>
            <p>Location: <span class="card-location">0, 0</span></p>
            <a class="btn btn-primary read-more" href="#">Read More</a>
          </div>
        </div>
      </div>
    </template>

    <!-- our own footer goes here -->
    <site-footer></site-footer>

    <!--Script-->
    <script type="module" src="/src/app.js"></script>
  </body>
</html>

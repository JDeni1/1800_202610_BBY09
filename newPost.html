<!doctype html>
<html lang="en">
  <head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
  </head>

  <body>
    <!-- our own navbar goes here -->
    <site-navbar></site-navbar>

    <!-- Main content goes here -->
    <div class="container">
      <h1>Make a Post</h1>
      <form>
        <div class="form-group">
          <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label"
              >Title of post</label
            >
            <input
              type="text"
              class="form-control"
              id="post-title"
              placeholder="title"
            />
          </div>
          <div class="mb-3">
            <label for="exampleFormControlTextarea1" class="form-label"
              >Post Discription</label
            >
            <textarea
              class="form-control"
              id="description"
              rows="3"
              placeholder="Discribe your post"
            ></textarea>
          </div>
        </div>
        <div class="container py-3">
          <input type="file" id="inputImage" accept="image/*" />
          <img id="mypic-goes-here" width="100" height="100" />
        </div>

        <div class="card-body">
          <p>Rate your overall experience:</p>
        </div>

        <div class="d-flex mt-5">
          <button id="postButton" type="button" class="btn btn-info">
            Post Now
          </button>
        </div>
      </form>
    </div>

    <!-- our own footer goes here -->
    <site-footer></site-footer>

    <!--Script-->
    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/newPost.js"></script>
  </body>
</html>

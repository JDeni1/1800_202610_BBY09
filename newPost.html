<!doctype html>
<html lang="en">
  <head>
    <title>Crowd Control</title>
    <meta name="comp1800 BBY-09" content="Crowd Control" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="module" src="/src/components/site-navbar.js"></script>
  </head>

  <body>
    <!-- our own navbar goes here -->
    <site-navbar></site-navbar>

    <!-- Main content goes here -->
    <div class="container">
      <h1>Make a Post</h1>
      <form>
        <div class="form-group">
          <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label"
              >Caption of post</label
            >
            <input
              type="text"
              class="form-control"
              id="post-title"
              placeholder="title"
            />
          </div>

          <div class="mb-3">
            <label for="exampleFormControlTextarea1" class="form-label"
              >Post Discription</label
            >
            <textarea
              class="form-control"
              id="detailsInput"
              rows="3"
              placeholder="Discribe your post"
            ></textarea>
          </div>

          <div class="container py-3">
            <input type="file" id="inputImage" accept="image/*" />
            <img id="mypic-goes-here" width="100" height="100" />
          </div>

          <!-- Populated by newPost.js -->
          <div class="mb-4">
            <label for="spotSelect" class="form-label fw-semibold"
              >Location</label
            >
            <select class="form-select" id="spotSelect">
              <option value="" disabled selected>Select an event spot…</option>
            </select>
            <div class="form-text">
              We'll pre-select the closest spot to you.
            </div>
          </div>

          <!--Crowds-->
          <div class="mb-4">
            <label class="form-label fw-semibold">Crowd Status</label>
            <div class="d-flex gap-3 flex-wrap mt-1">
              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="crowdStatus"
                  id="status1"
                  value="1"
                />
                <label class="form-check-label rating-label" for="status1"
                  >1 : Not Crowded</label
                >
              </div>

              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="crowdStatus"
                  id="status2"
                  value="2"
                />
                <label class="form-check-label rating-label" for="status2"
                  >2</label
                >
              </div>

              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="crowdStatus"
                  id="status3"
                  value="3"
                />
                <label class="form-check-label rating-label" for="status3"
                  >3</label
                >
              </div>

              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="crowdStatus"
                  id="status4"
                  value="4"
                />
                <label class="form-check-label rating-label" for="status4"
                  >4</label
                >
              </div>

              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="crowdStatus"
                  id="status5"
                  value="5"
                />
                <label class="form-check-label rating-label" for="status5"
                  >5 : Very Crowded</label
                >
              </div>

              <div class="d-flex mt-5">
                <button
                  id="submitBtn"
                  type="button"
                  class="btn btn-primary w-100"
                >
                  Post Now
                </button>
                <div
                  id="form-feedback"
                  class="mt-2"
                  style="font-size: 14px"
                ></div>
              </div>
              <div id="formFeedback" style="display: none"></div>
            </div>
          </div>
        </div>
      </form>
    </div>

    <!--Script-->
    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/newPost.js"></script>
  </body>
</html>

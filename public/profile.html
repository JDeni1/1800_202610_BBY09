<!doctype html>
<html lang="en">
  <head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script type="module" src="/src/components/site-navbar.js"></script>

    <style>
      body {
        background-color: #f8f9fa;
      }

      .profile-page {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }

      .profile-header {
        background: white;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        margin-bottom: 24px;
      }

      .profile-top {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .profile-avatar {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #dee2e6;
      }

      .profile-title {
        margin: 0;
        font-size: 2rem;
        font-weight: 700;
      }

      .profile-subtitle {
        margin: 4px 0 0;
        color: #6c757d;
      }

      .upload-box {
        margin-top: 18px;
      }

      .section-title {
        font-size: 1.3rem;
        font-weight: 700;
        margin-bottom: 16px;
      }

      .post-card {
        border: none;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        height: 100%;
      }

      .card-image {
        width: 100%;
        height: 220px;
        object-fit: cover;
      }

      .empty-posts {
        background: white;
        border-radius: 16px;
        padding: 24px;
        text-align: center;
        color: #6c757d;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      }
    </style>
  </head>

  <body>
    <site-navbar></site-navbar>

    <main class="profile-page">
      <section class="profile-header">
        <div class="profile-top">
          <img
            id="profileImage"
            class="profile-avatar"
            src="/images/default-profile.png"
            alt="Profile Picture"
          />

          <div>
            <h1 id="profileName" class="profile-title">Profile</h1>
            <p id="profileSubtitle" class="profile-subtitle">0 posts</p>
          </div>
        </div>

        <div class="upload-box">
          <label for="inputImage" class="form-label fw-semibold">
            Update profile picture
          </label>
          <input
            class="form-control"
            type="file"
            id="inputImage"
            accept="image/*"
          />
        </div>
      </section>

      <section>
        <h2 class="section-title">My Posts</h2>

        <div id="emptyPostsMessage" class="empty-posts">
          No posts yet.
        </div>

        <div id="postsContainer" class="row g-4"></div>
      </section>
    </main>

    <template id="postCardTemplate">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card post-card">
          <img class="card-img-top card-image" src="" alt="post image" />
          <div class="card-body">
            <h5 class="card-title"></h5>
            <p class="card-text"></p>
            <p class="mb-3">
              <strong>Location:</strong>
              <span class="card-location"></span>
            </p>
            <a class="btn btn-primary read-more" href="#">Read More</a>
          </div>
        </div>
      </div>
    </template>

    <script type="module" src="/src/profile.js"></script>
  </body>
</html>
